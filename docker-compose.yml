services:
  # 1. PostgreSQL Database Server (Internal & External Port: 1543)
  postgres:
    image: postgres:17-alpine
    container_name: sanab-postgres
    command: ["postgres", "-p", "1543"]
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: sanab_admin
      POSTGRES_PASSWORD: sanab_password_123
    ports:
      - "1543:1543"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanab_admin -d defaultdb -p 1543"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Token Blacklist (Internal & External Port: 1637)
  redis:
    image: redis:7-alpine
    container_name: sanab-redis
    command: ["redis-server", "--port", "1637"]
    ports:
      - "1637:1637"

  # 3. Apache Kafka Broker (Official Apache Image - KRaft Mode) (Internal & External Port: 1909)
  kafka:
    image: apache/kafka:latest
    container_name: sanab-kafka
    ports:
      - "1909:1909"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:1909,CONTROLLER://:1903
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:1909
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:1903
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  # 4. SANAB Spring Boot Backend Server (Internal & External Port: 1808)
  backend:
    build:
      context: ./sanab-backend
      dockerfile: Dockerfile
    container_name: sanab-backend
    ports:
      - "1808:1808"
    environment:
      - SERVER_PORT=1808
      - DB_HOST=postgres
      - DB_PORT=1543
      - DB_NAME=defaultdb
      - DB_USERNAME=sanab_admin
      - DB_PASSWORD=sanab_password_123
      - REDIS_HOST=redis
      - REDIS_PORT=1637
      - KAFKA_BOOTSTRAP_SERVERS=kafka:1909
    depends_on:
      postgres:
        condition: service_healthy

  # 5. SANAB Next.js Storefront UI (Internal & External Port: 1300)
  frontend:
    build:
      context: ./sanab-frontend
      dockerfile: Dockerfile
    container_name: sanab-frontend
    ports:
      - "1300:1300"
    environment:
      - PORT=1300
      - NEXT_PUBLIC_API_URL=http://localhost:1808
    depends_on:
      - backend

volumes:
  postgres_data:
