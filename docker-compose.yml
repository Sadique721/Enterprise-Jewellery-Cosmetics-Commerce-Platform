services:
  # 1. PostgreSQL Database Server
  postgres:
    image: postgres:17-alpine
    container_name: sanab-postgres
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: sanab_admin
      POSTGRES_PASSWORD: sanab_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanab_admin -d defaultdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Token Blacklist
  redis:
    image: redis:7-alpine
    container_name: sanab-redis
    ports:
      - "6379:6379"

  # 3. Apache Kafka Broker (KRaft Mode)
  kafka:
    image: bitnami/kafka:3.8.0
    container_name: sanab-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  # 4. SANAB Spring Boot Backend Server
  backend:
    build:
      context: ./sanab-backend
      dockerfile: Dockerfile
    container_name: sanab-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=defaultdb
      - DB_USERNAME=sanab_admin
      - DB_PASSWORD=sanab_password_123
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  # 5. SANAB Next.js Storefront UI
  frontend:
    build:
      context: ./sanab-frontend
      dockerfile: Dockerfile
    container_name: sanab-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
