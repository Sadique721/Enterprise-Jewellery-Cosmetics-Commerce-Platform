name: SANAB Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sanab-backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sanab-backend/**'

jobs:
  build-and-test:
    name: Java 25 Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build & Package Submodules (Maven)
        run: |
          cd sanab-backend
          mvn clean install -DskipTests

      - name: Verify Flyway Database Migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Flyway dry-run validation passed."

  docker-build-push:
    name: Build & Push Production Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./sanab-backend
          file: ./sanab-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sanab-backend:latest
            ghcr.io/${{ github.repository }}/sanab-backend:${{ github.sha }}
